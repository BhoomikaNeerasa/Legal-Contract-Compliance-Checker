<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OTP Verification — Compliance Checker</title>

<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<style>
.otp-input {
  width: 45px;
  height: 50px;
  font-size: 22px;
  text-align: center;
  margin: 0 5px;
}
</style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Compliance Checker</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/login">Login / Register</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/#contact">Contact</a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<main class="flex-fill d-flex align-items-center justify-content-center">
<div class="card shadow p-4 slide-in-left" style="max-width: 420px; width:100%;">

<h4 class="text-center mb-2">OTP Verification</h4>

{% if email %}
<p class="text-center text-muted">
  OTP sent to: <strong>{{ email }}</strong>
</p>
{% endif %}

{% if error %}
<div class="alert alert-danger text-center">
  {{ error }}
</div>
{% endif %}

<form method="POST" id="otpForm">

<div class="d-flex justify-content-between mb-3" id="otpContainer">
  <input type="text" maxlength="1" class="form-control text-center otp-input">
  <input type="text" maxlength="1" class="form-control text-center otp-input">
  <input type="text" maxlength="1" class="form-control text-center otp-input">
  <input type="text" maxlength="1" class="form-control text-center otp-input">
  <input type="text" maxlength="1" class="form-control text-center otp-input">
  <input type="text" maxlength="1" class="form-control text-center otp-input">
</div>

<!-- Hidden input for backend -->
<input type="hidden" name="otp" id="finalOtp">

<button class="btn btn-primary w-100">Verify OTP</button>


</form>

<div class="text-center mt-3">
  <small id="timer">Resend available in 60s</small><br>
  <a href="/resend-login-otp" id="resendBtn" style="display:none;">
    Resend OTP
  </a>
</div>

</div>
</main>

<footer class="text-center py-3 bg-primary text-white mt-auto">
&copy; 2026 Legal Contract Compliance Checker | <a href="mailto:bhoomikaneerasa16@gmail.com">Contact Us</a>
</footer>

<script>
const inputs = document.querySelectorAll(".otp-input");
const finalOtp = document.getElementById("finalOtp");
const form = document.getElementById("otpForm");


// Handle typing + auto next
inputs.forEach((input, index) => {

  input.addEventListener("input", (e) => {
    input.value = input.value.replace(/[^0-9]/g, ""); // numbers only

    if (input.value && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }

    updateHiddenOtp();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace") {
      if (input.value === "" && index > 0) {
        inputs[index - 1].focus();
      }
    }
  });

});


// Handle paste
inputs[0].addEventListener("paste", function(e) {
  e.preventDefault();
  const pasteData = e.clipboardData.getData("text").trim();

  if (/^\d{6}$/.test(pasteData)) {
    pasteData.split("").forEach((digit, i) => {
      inputs[i].value = digit;
    });

    updateHiddenOtp();
    inputs[5].focus();
  }
});


// Update hidden OTP field
function updateHiddenOtp() {
  let otp = "";
  inputs.forEach(input => otp += input.value);
  finalOtp.value = otp;
}


// Ensure hidden field filled on submit
form.addEventListener("submit", function() {
  updateHiddenOtp();
});


// Countdown timer
let timeLeft = 60;
const timer = document.getElementById("timer");
const resendBtn = document.getElementById("resendBtn");

const countdown = setInterval(() => {
  timeLeft--;
  timer.textContent = "Resend available in " + timeLeft + "s";

  if (timeLeft <= 0) {
    clearInterval(countdown);
    timer.style.display = "none";
    resendBtn.style.display = "inline";
  }
}, 1000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
