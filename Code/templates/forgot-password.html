<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — Compliance Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">
  <style>
    .slide-in-left { opacity: 0; transform: translateX(-50px); animation: slideIn 1s forwards; }
    @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
    .card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.25); }
    a { color: #0d6efd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .navbar-nav .nav-link { color: black; }
    .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active { color: black; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Compliance Checker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/login">Login / Register</a></li>
          <li class="nav-item"><a class="nav-link" href="/#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-fill d-flex align-items-center justify-content-center">
    <div class="card shadow p-4 slide-in-left" style="max-width: 400px; width:100%;">
      <h3 class="text-center mb-4">Forgot Password</h3>
      {% if error %}
      <div class="alert alert-danger text-center">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/forgot-password">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
  
        <p class="text-muted">Enter your email and we’ll send instructions to reset your password.</p>
        <div class="d-flex justify-content-between mb-3">
          <a href="/login">Back to Login</a>
          <a href="/register">Register</a>
        </div>
        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
      </form>
    </div>
  </main>

  <footer id="contact" class="text-center py-3 bg-primary text-white mt-auto">
    <p>&copy; 2026 Legal Contract Compliance Checker | <a href="mailto:bhoomikaneerasa16@gmail.com">Contact Us</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
