<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — Compliance Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Floating Help Button */
.help-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6f42c1, #8e44ad);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.help-btn i {
  font-size: 26px;
  color: white;
}

.help-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.help-container {
  background: white;
  width: 90%;
  max-width: 750px;   /* Increased width */
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 14px;
  padding: 20px;
}

.help-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.help-item {
  padding: 12px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.help-item:hover {
  background: #f8f9fa;
}
</style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Navbar -->
  <div id="navbar"></div>

  <main class="container flex-fill py-5 text-center">
    <h2>
  Welcome, {{ session['user'].split('@')[0] }} 👋
</h2>

<p class="lead mt-2">
  You can upload contracts and review compliance insights here.
</p>

    <div class="alert alert-light mt-4">
  <p class="mb-0">
    This workspace is configured for reviewing and managing
    contract compliance activities within the system.
  </p>
</div>
  </main>
<!-- Floating Help Chat Button -->
<button id="helpBtn" class="help-btn">
  <i class="bi bi-chat-dots-fill"></i>
</button>
<!-- Help Center Overlay -->
<div id="helpOverlay" class="help-overlay d-none">
  <div class="help-container">

    <div class="help-header">
      <button id="helpBack" class="btn btn-sm btn-light d-none">
        <i class="bi bi-arrow-left"></i>
      </button>

      <h5 id="helpTitle" class="m-0">Help Center</h5>

      <button id="helpClose" class="btn btn-sm btn-danger">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div id="helpContent"></div>

  </div>
</div>
  <footer class="text-center py-3 bg-primary text-white mt-auto">
    <p>&copy; 2026 Legal Contract Compliance Checker |
      <a href="mailto:bhoomikaneerasa16@gmail.com">Contact Us</a>
    </p>
  </footer>

  <!-- Load Navbar -->
  <script>
    fetch("navbar-auth.html")
      .then(res => res.text())
      .then(data => document.getElementById("navbar").innerHTML = data);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/faq-data.js"></script>
<script src="/static/help-desk.js"></script>
</body>
</html>
