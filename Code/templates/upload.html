<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Contract — Compliance Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">

  <style>
    #chatBox {
      height: 280px;
      overflow-y: auto;
      background: #f8f9fa;
      padding: 10px;
    }

    .chat-user { text-align: right; margin-bottom: 8px; }
    .chat-bot { text-align: left; margin-bottom: 8px; }

    .chat-bubble {
      display: inline-block;
      max-width: 75%;
      padding: 6px 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .user-bubble { background: #0d6efd; color: white; }
    .bot-bubble { background: #6c757d; color: white; }

    .sticky-panel {
      position: sticky;
      top: 90px;
    }
  </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div id="navbar"></div>

<div class="container py-5 flex-fill">

  <!-- UPLOAD ONLY -->
  <div class="row justify-content-center" id="uploadOnlyRow">
    <div class="col-md-5">
      <div class="card p-3 shadow">
        <h5>Upload Legal Contract</h5>

        <form id="uploadForm" onsubmit="return false;">
          <input type="file" id="contractFile" name="contract"
                 class="form-control mb-2"
                 accept=".pdf,.txt,.docx" required>

          <div id="fileInfo" class="text-muted small"></div>
          <div id="fileError" class="text-danger small"></div>

          <button type="submit" class="btn btn-primary w-100 mt-2">
            Upload & Analyze
          </button>

          <p class="text-muted text-center mt-2 small">
            Accepted formats: PDF, TXT, DOCX · Max size: 5 MB
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- ANALYSIS VIEW -->
  <div class="d-none" id="analysisRow">

    <!-- HEADER -->
    <div class="row mb-3">
      <div class="col-12">
        <h4>Contract Analysis</h4>
        <div id="decisionBox" class="alert"></div>
      </div>
    </div>

    <div class="row">

      <!-- LEFT -->
      <div class="col-md-8">
        <div id="analysisOutput"></div>

        <div class="mt-3 d-none" id="downloadButtons">
          <a href="/download/pdf" class="btn btn-danger me-2">Download PDF</a>
          <a href="/download/text" class="btn btn-secondary me-2">Download TXT</a>
          <button class="btn btn-outline-primary" id="resetBtn">
            Upload Another Contract
          </button>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="col-md-4">
        <div class="card p-3 shadow sticky-panel">
          <h6>Upload Legal Contract</h6>

          <!-- ✅ ENABLED FILE INPUT -->
          <input type="file"
                 id="contractFileRight"
                 class="form-control mb-2"
                 accept=".pdf,.txt,.docx">

          <!-- ✅ FILE INFO (NAME + MB) -->
          <div id="fileInfoRight" class="text-muted small"></div>
          <div id="fileErrorRight" class="text-danger small"></div>

          <!-- ✅ BLUE BUTTON -->
          <button class="btn btn-primary w-100 mt-2" id="uploadBtnRight">
            Upload & Analyze
          </button>

          <p class="text-muted small mt-2">
            Accepted formats: PDF, TXT, DOCX · Max size: 5 MB
          </p>

          <hr>

          <strong>Uploaded File:</strong>
          <div id="fileName" class="text-break">—</div>
        </div>
      </div>

    </div>

    <!-- CHATBOT FULL WIDTH -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="card shadow p-3 d-none" id="chatSection">
          <h6>🤖 Legal Chatbot</h6>

          <div id="chatBox"></div>

          <div class="input-group mt-2">
            <input type="text" id="chatInput"
       class="form-control"
       placeholder="Ask about the contract or related law…"
       autocomplete="off">
            <button class="btn btn-primary" id="sendBtn">Send</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="bg-primary text-white text-center py-3 mt-auto">
  <p class="mb-0">&copy; 2026 Legal Contract Compliance Checker |
    <a href="mailto:bhoomikaneerasa16@gmail.com">Contact Us</a>
  </p>
</footer>

<script>
fetch("/navbar-auth.html")
  .then(res => res.text())
  .then(data => document.getElementById("navbar").innerHTML = data);
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const form = document.getElementById("uploadForm");
  const fileInput = document.getElementById("contractFile");
  const fileInputRight = document.getElementById("contractFileRight");

  const fileInfoRight = document.getElementById("fileInfoRight");
  const fileErrorRight = document.getElementById("fileErrorRight");
  const uploadBtnRight = document.getElementById("uploadBtnRight");

  const fileNameBox = document.getElementById("fileName");

  const uploadOnlyRow = document.getElementById("uploadOnlyRow");
  const analysisRow = document.getElementById("analysisRow");

  const decisionBox = document.getElementById("decisionBox");
  const analysisOutput = document.getElementById("analysisOutput");
  const downloadButtons = document.getElementById("downloadButtons");
  const chatSection = document.getElementById("chatSection");

  const chatBox = document.getElementById("chatBox");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");

  const maxSize = 5 * 1024 * 1024;

  /* 🔹 RIGHT FILE PICKER SYNC */
  fileInputRight.addEventListener("change", function () {
    fileInfoRight.textContent = "";
    fileErrorRight.textContent = "";

    const file = this.files[0];
    if (!file) return;

    if (file.size > maxSize) {
      fileErrorRight.textContent = "File size exceeds 5 MB.";
      this.value = "";
      return;
    }

    fileInput.files = this.files;
    fileInput.dispatchEvent(new Event("change"));

    fileInfoRight.textContent =
      `Selected: ${file.name} (${(file.size / 1048576).toFixed(2)} MB)`;
  });

  /* 🔹 RIGHT BUTTON SUBMIT */
  uploadBtnRight.onclick = () => form.requestSubmit();

  /* EXISTING SUBMIT LOGIC (UNCHANGED) */
  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const file = fileInput.files[0];
    if (!file) return;

    uploadOnlyRow.classList.add("d-none");
    analysisRow.classList.remove("d-none");

    decisionBox.className = "alert alert-info";
    decisionBox.textContent = "⏳ Analyzing contract…";

    analysisOutput.innerHTML = "";
    chatBox.innerHTML = "";
    downloadButtons.classList.add("d-none");
    chatSection.classList.add("d-none");

    const data = new FormData();
    data.append("contract", file);

    const res = await fetch("/analyze", { method: "POST", body: data });
    const json = await res.json();

    fileNameBox.textContent = json.filename;

    decisionBox.className =
      json.decision.includes("HIGH RISK") ? "alert alert-danger" :
      json.decision.includes("CONCERNING") ? "alert alert-warning" :
      "alert alert-success";

    decisionBox.textContent = json.decision;

    json.analysis.forEach((c, i) => {
      analysisOutput.innerHTML += `
        <div class="card p-3 mb-3">
          <strong>Clause ${i + 1}</strong>
          <p>${c.clause}</p>
          <p><b>Risk:</b> ${c.risk}</p>
          <p><b>Laws:</b> ${c.laws.join(", ") || "None"}</p>
          <p><b>Explanation:</b> ${c.explanation}</p>
          <p><b>Fix:</b> ${c.fix}</p>
        </div>`;
    });

    downloadButtons.classList.remove("d-none");
    chatSection.classList.remove("d-none");
  });

  sendBtn.onclick = async function () {
    
    const q = chatInput.value.trim();
    if (!q) return;

    chatBox.innerHTML += `
      <div class="chat-user">
        <div class="chat-bubble user-bubble">${q}</div>
      </div>`;

    chatInput.value = "";

    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q })
    });

    const json = await res.json();

    chatBox.innerHTML += `
      <div class="chat-bot">
        <div class="chat-bubble bot-bubble">${json.answer}</div>
      </div>`;

    chatBox.scrollTop = chatBox.scrollHeight;
  };
chatInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    e.preventDefault();   // stop newline / form submit
    sendBtn.click();      // reuse send button logic
  }
});

  resetBtn.onclick = () => location.reload();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
