<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password — Compliance Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Compliance Checker</a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">

        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/login">Login / Register</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/#contact">Contact</a>
        </li>

      </ul>
    </div>
  </div>
</nav>


<main class="flex-fill d-flex align-items-center justify-content-center">
  <div class="card shadow p-4" style="max-width: 400px; width:100%;">
    <h3 class="text-center mb-4">Reset Password</h3>

    {% if error %}
    <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
  <label class="form-label">Enter OTP</label>

  <div class="d-flex mb-3">
    <input type="text" maxlength="1" class="form-control text-center otp-input mx-1">
    <input type="text" maxlength="1" class="form-control text-center otp-input mx-1">
    <input type="text" maxlength="1" class="form-control text-center otp-input mx-1">
    <input type="text" maxlength="1" class="form-control text-center otp-input mx-1">
    <input type="text" maxlength="1" class="form-control text-center otp-input mx-1">
    <input type="text" maxlength="1" class="form-control text-center otp-input mx-1">
  </div>

  <input type="hidden" name="otp" id="finalOtp">

  <small id="timer">Resend available in 60s</small><br>
  <a href="/resend-reset-otp" id="resendBtn" style="display:none;">
    Resend OTP
  </a>
  </div>

      <div class="mb-3">
        <label>New Password</label>
        <input type="password" name="new_password" class="form-control" required>
      </div>

      <button class="btn btn-primary w-100">Update Password</button>
    </form>
  </div>
</main>

<footer class="text-center py-3 bg-primary text-white mt-auto">
  &copy; 2026 Legal Contract Compliance Checker | <a href="mailto:bhoomikaneerasa16@gmail.com">Contact Us</a>
</footer>

<script>
const inputs = document.querySelectorAll(".otp-input");
const finalOtp = document.getElementById("finalOtp");

// Auto move + backspace
inputs.forEach((input, index) => {

  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");

    if (input.value && index < inputs.length - 1) {
      inputs[index + 1].focus();
    }

    updateHiddenOtp();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && input.value === "" && index > 0) {
      inputs[index - 1].focus();
    }
  });

});

// Paste support
inputs[0].addEventListener("paste", function(e) {
  e.preventDefault();
  const pasteData = e.clipboardData.getData("text").trim();

  if (/^\d{6}$/.test(pasteData)) {
    pasteData.split("").forEach((digit, i) => {
      inputs[i].value = digit;
    });

    updateHiddenOtp();
    inputs[5].focus();
  }
});

function updateHiddenOtp() {
  let otp = "";
  inputs.forEach(input => otp += input.value);
  finalOtp.value = otp;
}

// Countdown timer
let timeLeft = 60;
const timer = document.getElementById("timer");
const resendBtn = document.getElementById("resendBtn");

const countdown = setInterval(() => {
  timeLeft--;
  timer.textContent = "Resend available in " + timeLeft + "s";

  if (timeLeft <= 0) {
    clearInterval(countdown);
    timer.style.display = "none";
    resendBtn.style.display = "inline";
  }
}, 1000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
